[pytest]
testpaths = tests
pythonpath = tests .
# Las pruebas de navegador real (e2e) son opcionales: se activan con `pytest -m e2e`.
addopts = -m "not e2e"
markers =
    e2e: recorrido del frontend en Chrome real contra el backend (requiere Node, Chrome e internet; ver tests/test_e2e_navegador.py)
